# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Lenny Bronner
email: lenny.bronner@gmail.com
description: Founder, Broome Street Labs
author:
  name: Lenny Bronner
  twitter: lennybronner

# Read by jekyll-seo-tag. Distinct from the *_username keys below,
# which _includes/header.html uses to build the nav links.
twitter:
  username: lennybronner
  card: summary
social:
  name: Lenny Bronner
  links:
    - https://twitter.com/lennybronner
    - https://github.com/lennybronner
    - https://www.linkedin.com/in/leonard-bronner
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://lennybronner.com" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: lennybronner
github_username:  lennybronner
linkedin_username: leonard-bronner
show_excerpts: true
# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# jekyll-seo-tag reads `image` from page front matter, not from a
# top-level site key, so set a site-wide default here.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/lenny_bronner_headshot.jpg

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
